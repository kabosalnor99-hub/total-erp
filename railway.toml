[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
preDeployCommand = "php artisan migrate --force && php artisan pdf:install-arabic-font"
startCommand = "/start.sh"

[env]
APP_ENV = "production"
APP_DEBUG = "false"
DB_CONNECTION = "mysql"
SESSION_DRIVER = "database"
QUEUE_CONNECTION = "sync"
CACHE_STORE = "database" 
PORT = "8080"

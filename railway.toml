[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "/start.sh"

[env]
APP_ENV = "production"
APP_DEBUG = "false"
DB_CONNECTION = "mysql"
SESSION_DRIVER = "database"
QUEUE_CONNECTION = "sync"
CACHE_STORE = "database"

[[services]]
type = "web"
name = "web"
protocol = "http"
healthcheckPath = "/"

[services.env]
PORT = "8080"

[[services]]
type = "mysql"
name = "mysql"
databaseName = "total_erp"
